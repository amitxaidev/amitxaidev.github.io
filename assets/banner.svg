<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Compiled Canvas — Free DSA course in Java">
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FF4D12"/>
      <stop offset="0.5" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FFC629"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F2EDE4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC629"/>
      <stop offset="1" stop-color="#FFC629" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" fill="#0E0D0C"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <!-- bars, like the videos -->
  <g opacity="0.9">
    <rect x="880" y="230" width="34" height="80" rx="4" fill="#2B2724"/>
    <rect x="924" y="190" width="34" height="120" rx="4" fill="#FF4D12"/>
    <rect x="968" y="250" width="34" height="60" rx="4" fill="#2B2724"/>
    <rect x="1012" y="150" width="34" height="160" rx="4" fill="#2B2724"/>
    <rect x="1056" y="210" width="34" height="100" rx="4" fill="#2B2724"/>
    <rect x="1100" y="120" width="34" height="190" rx="4" fill="#FFC629"/>
    <rect x="1144" y="170" width="34" height="140" rx="4" fill="#2B2724"/>
  </g>
  <circle cx="1117" cy="96" r="22" fill="url(#spark)"/>
  <circle cx="1117" cy="96" r="5" fill="#FFC629"/>
  <text x="80" y="150" font-family="Archivo Black, Arial Black, Helvetica, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="2">
    <tspan fill="#F2EDE4">COMPILED</tspan><tspan fill="url(#canvas)" dx="18">CANVAS</tspan>
  </text>
  <text x="84" y="210" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#F2EDE4">Free coding courses for tech careers</text>
  <text x="84" y="256" font-family="Menlo, Consolas, monospace" font-size="22" fill="#FF8A1F">watch → understand → try with hints → check the solution</text>
  <text x="84" y="310" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#F2EDE4" fill-opacity="0.7">Developed and created by Amit Singh</text>
</svg>
